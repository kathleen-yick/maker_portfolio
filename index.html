/* ── THEME ────────────────────────────────────────────────  🎨 safe to tweak ─
   Colours and font for the whole site. Change a value here and it changes
   everywhere. Colours are hex codes; pick them with any colour picker.     */
:root {
  --font: "Exo 2", "Segoe UI", Helvetica, Arial, sans-serif;

  --page:       #FFFFFF;   /* page background                                  */
  --panel:      #F5F5F5;   /* the light grey cards each section sits in        */
  --ink:        #5A5250;   /* headings and main text                           */
  --ink-soft:   #7D7573;   /* paragraphs, descriptions                         */
  --ink-faint:  #A8A19F;   /* the "|" bars, footer, carousel arrows            */
  --rule:       #E4DFDD;   /* thin divider lines                               */
  --blush:      #CFC3C1;   /* empty image placeholder                          */
  --blush-deep: #C6B8B5;   /* frame around the resume                          */
  --oval:       #5B4C4B;   /* the dark oval drawn on empty placeholders        */
  --accent:     #A65E61;   /* links, active tab underline, placeholder figure  */

  --page-width: 1120px;    /* max width of the content column                  */
}

/* ── LAYOUT ──────────────────────────────────────  🚫 leave alone unless you

/* reset */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {

}
img { max-width: 100%; display: block; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* page column */
.wrap { max-width: var(--page-width); margin: 0 auto; padding: 0 24px; }
@media (max-width: 640px) { .wrap { padding: 0 16px; } }

/* masthead + tab bar */

}

/* section panels */
main { padding-bottom: 40px; }
.panel { background: var(--panel); padding: 44px 48px 52px; animation: panel-in .25s ease; }

@media (max-width: 640px) { .panel { padding: 28px 20px 36px; } }

.h2 { font-size: 27px; font-weight: 500; line-height: 1.2; letter-spacing: .005em; }

.life-photos { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; margin: 30px 0; }
.life-outro { margin-top: 14px; }
.life-photos .pic { flex: 0 1 200px; width: auto; min-width: 0; aspect-ratio: 1; }
.life-photos .pic:nth-child(even) { flex-basis: 120px; }
.links { display: grid; gap: 4px; margin-top: 14px; }
.links a { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--rule); color: var(--ink); font-size: 14px; }
.links a:hover { color: var(--accent); text-decoration: none; }
.links a span { color: var(--ink-faint); }
@media (max-width: 760px) { .life-grid { grid-template-columns: 1fr; } }

/* footer + error box */
.foot { padding: 6px 0 44px; font-size: 12px; color: var(--ink-faint); }
.oops { background: #FCEBEB; color: #7A2E2E; border: 1px solid #E9B8B8; padding: 14px 18px; margin: 16px; font-size: 14px; line-height: 1.5; }
.oops code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
</style>
</head>

<body>
<!-- ═══════════════════════════════════════════════════════════════════════════
     PART 3 · PAGE SKELETON                                       🚫 DO NOT EDIT
     ═══════════════════════════════════════════════════════════════════════════
     Empty containers that the script in Part 4 fills from your content in
     Part 1. The id="" names are what the script looks for. Renaming or
     removing one breaks the page.
     ═══════════════════════════════════════════════════════════════════════════ -->

<noscript><div class="oops">This site needs JavaScript turned on to display its content.</div></noscript>

<div class="wrap">
  <header class="masthead"><h1 id="site-title"></h1></header>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
</div>

<main class="wrap">

  <section class="panel" id="page-about" aria-labelledby="h-about">
    <div class="about-hero">
      <div id="portrait"></div>
      <div>
        <h2 class="h2" id="h-about">About Me</h2>
        <div class="prose" id="bio"></div>
      </div>
    </div>
    <div class="about-info">
      <div>
        <h3 class="h3">Additional Info</h3>
        <dl class="info-list" id="info"></dl>
      </div>
      <div id="side-photo"></div>
    </div>
    <div class="featured-wrap" id="featured-wrap">
      <h3 class="h3">Featured Projects</h3>
      <div class="featured" id="featured"></div>
      <a class="seeall" href="#projects">All projects →</a>
    </div>
  </section>

  <section class="panel" id="page-resume" aria-labelledby="h-resume" hidden>
    <h2 class="h2" id="h-resume">Resume</h2>
    <div id="resume-body"></div>
  </section>

  <section class="panel" id="page-projects" aria-labelledby="h-projects" hidden>
    <h2 class="h2" id="h-projects">Projects</h2>
    <div class="cat-nav" id="cat-nav"></div>
    <div class="cols" id="cols"></div>
  </section>

  <section class="panel" id="page-life" aria-labelledby="h-life" hidden>
    <h2 class="h2" id="h-life">Life</h2>
    <div class="life-grid">
      <div>
        <div class="prose" id="life-intro"></div>
        <div class="life-photos" id="life-photos"></div>
        <div class="prose life-outro" id="life-outro"></div>
      </div>
      <aside id="life-aside">
        <h3 class="h3">Elsewhere</h3>
        <div class="links" id="life-links"></div>
      </aside>
    </div>
  </section>

</main>

<div class="wrap"><footer class="foot" id="foot"></footer></div>

<!-- Full-screen project view. Opened by the script; closed with the button or Esc. -->
<dialog class="modal" id="modal" aria-label="Project">
  <button class="modal-close" type="button" data-close>Close ✕</button>
  <div class="modal-inner" id="modal-body"></div>
</dialog>



<script>
/* ═══════════════════════════════════════════════════════════════════════════
   PART 4 · SCRIPT                                                🚫 DO NOT EDIT
   ═══════════════════════════════════════════════════════════════════════════
   Reads SITE / ABOUT / RESUME / CATEGORIES / PROJECTS / LIFE from Part 1 and
   builds the page. Handles the tabs, the category filter, the image
   slideshows and the full-screen project view. No content lives here.
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  "use strict";

  var TABS = [
    ["about",    "About Me"],
    ["resume",   "Resume"],
    ["projects", "Projects"],
    ["life",     "Life"]
  ];
  var currentTab = "about";
  var currentCat = "all";

  function $(id) { return document.getElementById(id); }

  /* ---- small helpers ---------------------------------------------------- */

  // Make text safe to drop into HTML.
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Blank line → new paragraph; single line break → <br>.
  function paras(text) {
    return String(text || "").trim().split(/\n\s*\n/).filter(Boolean).map(function (p) {
      return "<p>" + esc(p.trim()).replace(/\n/g, "<br>") + "</p>";
    }).join("");
  }

  function isExternal(url) { return /^https?:\/\//i.test(url || ""); }
  function linkAttrs(url) { return isExternal(url) ? ' target="_blank" rel="noopener"' : ""; }

  // An image box. Shows the photo if a path is given, otherwise a placeholder.
  // opts: { tag, cls, attrs, person }
  function pic(src, alt, opts) {
    opts = opts || {};
    src = String(src || "").trim();
    var tag = opts.tag || "span";
    var cls = "pic" + (src ? "" : " empty") + (opts.person ? " person" : "") + (opts.cls ? " " + opts.cls : "");
    return "<" + tag + ' class="' + cls + '"' + (opts.attrs || "") + ">" +
      (src ? '<img src="' + esc(src) + '" alt="' + esc(alt) + '" loading="lazy">' : "") +
      "</" + tag + ">";
  }

  function categoryLabel(id) {
    var c = CATEGORIES.filter(function (x) { return x.id === id; })[0];
    return c ? c.label : id;
  }

  // "2023–2025" → 2025; no year → -1 (sorts to the end).
  function yearOf(p) {
    var m = String(p.year || "").match(/\d{4}/g);
    return m ? Math.max.apply(null, m.map(Number)) : -1;
  }
  function sorted(list) {
    if (!SITE.projectsNewestFirst) return list;
    return list.slice().sort(function (a, b) { return yearOf(b) - yearOf(a); });
  }

  /* ---- slideshow -------------------------------------------------------- */

  // inModal = true renders plain slides (clicking them does nothing extra).
  function carousel(p, inModal) {
    var imgs = (p.images && p.images.length) ? p.images : [""];
    var multi = imgs.length > 1;
    var slides = imgs.map(function (src, i) {
      var alt = p.title + (multi ? " — image " + (i + 1) + " of " + imgs.length : "");
      return inModal
        ? pic(src, alt, { cls: "car-slide" })
        : pic(src, alt, { tag: "button", cls: "car-slide", attrs: ' type="button" data-open="' + p._id + '" aria-label="Open ' + esc(p.title) + '"' });
    }).join("");
    return '<div class="car">' +
      '<div class="car-track">' + slides + "</div>" +
      (multi
        ? '<button class="car-btn prev" type="button" data-car="-1" aria-label="Previous image">&lsaquo;</button>' +
          '<button class="car-btn next" type="button" data-car="1" aria-label="Next image">&rsaquo;</button>' +
          '<div class="car-dots" aria-hidden="true">' +
            imgs.map(function (_, i) { return '<i class="' + (i ? "" : "on") + '"></i>'; }).join("") +
          "</div>"
        : "") +
      "</div>";
  }

  function slide(car, dir) {
    var track = car.querySelector(".car-track");
    var n = track.children.length, w = track.clientWidth;
    if (!n || !w) return;
    var i = Math.round(track.scrollLeft / w);
    var next = (i + dir + n) % n;            // wraps around at both ends
    track.scrollTo({ left: next * w, behavior: "smooth" });
  }

  // Keep the dots in step when a slideshow is swiped or scrolled.
  document.addEventListener("scroll", function (e) {
    var track = e.target;
    if (!(track instanceof Element) || !track.classList.contains("car-track")) return;
    var dots = track.parentNode.querySelectorAll(".car-dots i");
    if (!dots.length || !track.clientWidth) return;
    var i = Math.round(track.scrollLeft / track.clientWidth);
    dots.forEach(function (d, k) { d.classList.toggle("on", k === i); });
  }, true);

  /* ---- render each page ------------------------------------------------- */

  function renderHeader() {
    $("site-title").innerHTML = esc(SITE.titleLine1) + (SITE.titleLine2 ? "<br>" + esc(SITE.titleLine2) : "");
    $("foot").textContent = SITE.footer || "";
  }

  function renderNav() {
    $("nav").innerHTML = '<span class="bar">|</span>' + TABS.map(function (t) {
      return '<button type="button" data-tab="' + t[0] + '"' + (t[0] === currentTab ? ' aria-current="page"' : "") + ">" +
        t[1] + '</button><span class="bar">|</span>';
    }).join("");
  }

  function renderAbout() {
    $("portrait").innerHTML = pic(ABOUT.portrait, "Portrait", { cls: "portrait", person: true });
    $("bio").innerHTML = paras(ABOUT.bio);

    var rows = (ABOUT.info || []).filter(function (r) { return r && r.value; });
    $("info").innerHTML = rows.map(function (r) {
      var v = r.href
        ? '<a href="' + esc(r.href) + '"' + linkAttrs(r.href) + ">" + esc(r.value) + "</a>"
        : esc(r.value);
      return '<div class="info-row"><dt>' + esc(r.label) + ":</dt><dd>" + v + "</dd></div>";
    }).join("");

    $("side-photo").innerHTML = pic(ABOUT.sidePhoto, "", { cls: "side-photo", person: true });

    var feat = sorted(PROJECTS.filter(function (p) { return p.featured; })).slice(0, 3);
    $("featured-wrap").hidden = !feat.length;
    $("featured").innerHTML = feat.map(function (p) {
      return '<button class="feat" type="button" data-open="' + p._id + '">' +
        pic((p.images || [])[0], p.title) +
        '<span class="ttl">' + esc(p.title) + "</span>" +
        '<span class="blurb">' + esc(p.blurb) + "</span></button>";
    }).join("");
  }

  function renderResume() {
    var f = String(RESUME.file || "").trim();
    if (!f) {
      $("resume-body").innerHTML =
        '<div class="paper-frame"><div class="paper-empty"><p>' + esc(RESUME.note || "Coming soon.") + "</p></div></div>";
      return;
    }
    $("resume-body").innerHTML =
      '<div class="paper-frame">' +
        '<object class="paper" data="' + esc(f) + '" type="application/pdf" aria-label="Resume PDF">' +
          '<div class="paper-empty"><p>This browser can’t show the PDF inline.</p>' +
          '<p><a href="' + esc(f) + '" target="_blank" rel="noopener">Open the PDF</a></p></div>' +
        "</object>" +
      "</div>" +
      '<div class="actions">' +
        '<a class="btn" href="' + esc(f) + '" download>Download PDF</a>' +
        '<a class="btn ghost" href="' + esc(f) + '" target="_blank" rel="noopener">Open in new tab</a>' +
      "</div>";
  }

  function projectCard(p) {
    return '<article class="card">' + carousel(p, false) +
      '<button class="ttl" type="button" data-open="' + p._id + '">' + esc(p.title) +
        (p.year ? '<span class="yr">' + esc(p.year) + "</span>" : "") + "</button>" +
      '<p class="blurb">' + esc(p.blurb) + "</p></article>";
  }

  function renderProjects() {
    var all = [{ id: "all", label: "All" }].concat(CATEGORIES);
    $("cat-nav").innerHTML = '<span class="bar">|</span>' + all.map(function (c) {
      return '<button type="button" data-cat="' + esc(c.id) + '" aria-pressed="' + (c.id === currentCat) + '">' +
        esc(c.label) + '</button><span class="bar">|</span>';
    }).join("");

    var cols = $("cols");
    cols.className = "cols" + (currentCat === "all" ? "" : " filtered");
    cols.innerHTML = CATEGORIES.filter(function (c) {
      return currentCat === "all" || c.id === currentCat;
    }).map(function (c) {
      var list = sorted(PROJECTS.filter(function (p) { return p.category === c.id; }));
      return '<section class="col"><h3 class="h3">' + esc(c.label) + '</h3><div class="col-list">' +
        (list.length ? list.map(projectCard).join("") : '<p class="blurb">Nothing here yet.</p>') +
        "</div></section>";
    }).join("");
  }

  function renderLife() {
    $("life-intro").innerHTML = paras(LIFE.intro);
    var photos = (LIFE.photos || []).filter(Boolean);
    $("life-photos").hidden = !photos.length;
    $("life-photos").innerHTML = photos.map(function (src, i) {
      return pic(src, "Photo " + (i + 1), { person: true });
    }).join("");
    $("life-outro").innerHTML = paras(LIFE.outro);

    var links = (LIFE.links || []).filter(function (l) { return l && l.url; });
    $("life-aside").hidden = !links.length;
    $("life-links").innerHTML = links.map(function (l) {
      return '<a href="' + esc(l.url) + '"' + linkAttrs(l.url) + ">" + esc(l.label) +
        "<span>" + (isExternal(l.url) ? "↗" : "→") + "</span></a>";
    }).join("");
  }

  /* ---- full-screen project view ---------------------------------------- */

  function openProject(id) {
    var p = PROJECTS[id];
    if (!p) return;
    var meta = [
      ["Category", categoryLabel(p.category)],
      ["Year", p.year],
      ["Role", p.role],
      ["Tools", p.tools]
    ].filter(function (m) { return m[1]; });

    $("modal-body").innerHTML =
      carousel(p, true) +
      "<h3>" + esc(p.title) + "</h3>" +
      '<div class="meta">' + meta.map(function (m) {
        return "<span><b>" + m[0] + "</b>" + esc(m[1]) + "</span>";
      }).join("") + "</div>" +
      '<div class="prose">' + (paras(p.description) || paras(p.blurb)) + "</div>" +
      (p.link ? '<p class="actions"><a class="btn" href="' + esc(p.link) + '" target="_blank" rel="noopener">Visit project ↗</a></p>' : "");

    var m = $("modal");
    if (!m.open) m.showModal();
    m.scrollTop = 0;
  }

  /* ---- tabs + address bar ----------------------------------------------- */
  // The open tab lives in the URL: #about  #resume  #projects  #life
  // A category filter adds a second part: #projects/design

  function showTab(tab) {
    if (!TABS.some(function (t) { return t[0] === tab; })) tab = "about";
    currentTab = tab;
    TABS.forEach(function (t) { $("page-" + t[0]).hidden = t[0] !== tab; });
    renderNav();
    window.scrollTo(0, 0);
  }

  function readHash() {
    var parts = location.hash.replace(/^#/, "").split("/");
    var tab = parts[0] || "about";
    var cat = parts[1] || "all";
    currentCat = CATEGORIES.some(function (c) { return c.id === cat; }) ? cat : "all";
    renderProjects();
    showTab(tab);
  }

  /* ---- clicks ----------------------------------------------------------- */

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-tab],[data-cat],[data-open],[data-car],[data-close]");
    if (!t) return;
    var d = t.dataset;
    if ("tab" in d)        location.hash = d.tab;
    else if ("cat" in d)   location.hash = "projects" + (d.cat === "all" ? "" : "/" + d.cat);
    else if ("open" in d)  openProject(Number(d.open));
    else if ("car" in d)   slide(t.closest(".car"), Number(d.car));
    else if ("close" in d) $("modal").close();
  });

  // Arrow keys move the slideshow while a project is open.
  $("modal").addEventListener("keydown", function (e) {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    var car = $("modal").querySelector(".car");
    if (car) { slide(car, e.key === "ArrowRight" ? 1 : -1); e.preventDefault(); }
  });

  /* ---- start ------------------------------------------------------------ */

  function init() {
    PROJECTS.forEach(function (p, i) {
      p._id = i;
      if (!CATEGORIES.some(function (c) { return c.id === p.category; })) {
        console.warn('Project "' + p.title + '" has category "' + p.category +
          '", which is not in CATEGORIES, so it will not be shown.');
      }
    });
    renderHeader();
    renderAbout();
    renderResume();
    renderLife();
    readHash();                                   // renders projects + picks the tab
    window.addEventListener("hashchange", readHash);
  }

  try {
    init();
  } catch (err) {
    // Most likely a typo in Part 1 (a missing comma or quote). Show it on the page.
    document.body.insertAdjacentHTML("afterbegin",
      '<div class="oops"><strong>The page couldn’t build.</strong> This is almost always a ' +
      'missing comma, quote or bracket in PART 1 of index.html. The browser says: ' +
      "<code>" + esc(err.message) + "</code></div>");
    throw err;
  }
})();
</script>
</body>
</html>
