/* ── 2l. FOOTER + ERROR BOX ───────────────────────────── 🚫 not editable ── */
/* 🚫 NOT EDITABLE.  ON THE WEBSITE: the copyright line, and the red box shown on a typo. */

.foot { padding: 6px 0 44px; font-size: 12px; color: var(--ink-faint); }
.oops { background: #FCEBEB; color: #7A2E2E; border: 1px solid #E9B8B8; padding: 14px 18px; margin: 16px; font-size: 14px; line-height: 1.5; }

<!-- ═══════════════════════════════════════════════════════════════════════════
     PART 3 · PAGE SKELETON                                       🚫 DO NOT EDIT
     ═══════════════════════════════════════════════════════════════════════════
     Empty containers that the script in Part 4 fills from your content in
     Part 1.

     ✏️ EDITABLE:      only the heading words typed between > and <,
                       for example  >About Me<  >Additional Info<  >Elsewhere<
                       ON THE WEBSITE: those exact words are the headings.
     🚫 NOT EDITABLE:  everything else — every  id="..."  class="..."  and tag.
                       The script looks these up by name.
                       Renaming or removing one breaks the page.
     ═══════════════════════════════════════════════════════════════════════════ -->

<noscript><div class="oops">This site needs JavaScript turned on to display its content.</div></noscript>


<!-- ── 3a. MASTHEAD + TAB BAR ──────────────────────────────────────────── -->

<div class="wrap">
  <header class="masthead"><h1 id="site-title"></h1><p class="sub" id="site-sub"></p></header>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
</div>


<main class="wrap">

  <!-- ── 3b. ABOUT ME ────────────────────────────────────────────────────── -->

  <section class="panel" id="page-about" aria-labelledby="h-about">
    <div class="about-hero">
      <div id="portrait"></div>
      <div>
        <h2 class="h2" id="h-about">About Me</h2>
        <div class="prose" id="bio"></div>
      </div>
    </div>
    <div class="about-info">
      <div>
        <h3 class="h3">Additional Info</h3>
        <dl class="info-list" id="info"></dl>
      </div>
      <div id="side-photo"></div>
    </div>
    <div class="featured-wrap" id="featured-wrap">
      <h3 class="h3">Featured Projects</h3>
      <div class="featured" id="featured"></div>
      <a class="seeall" href="#projects">All projects →</a>
    </div>
  </section>


  <!-- ── 3c. RESUME ──────────────────────────────────────────────────────── -->

  <section class="panel" id="page-resume" aria-labelledby="h-resume" hidden>
    <h2 class="h2" id="h-resume">Resume</h2>
    <div id="resume-body"></div>
  </section>


  <!-- ── 3d. PROJECTS ────────────────────────────────────────────────────── -->

  <section class="panel" id="page-projects" aria-labelledby="h-projects" hidden>
    <h2 class="h2" id="h-projects">Projects</h2>
    <div class="cat-nav" id="cat-nav"></div>
    <div class="cols" id="cols"></div>
  </section>


  <!-- ── 3e. LIFE ────────────────────────────────────────────────────────── -->

  <section class="panel" id="page-life" aria-labelledby="h-life" hidden>
    <h2 class="h2" id="h-life">Life</h2>
    <div class="life-grid">
      <div>
        <div class="prose" id="life-intro"></div>
        <div class="life-photos" id="life-photos"></div>
        <div class="prose life-outro" id="life-outro"></div>
      </div>
      <aside id="life-aside">
        <h3 class="h3">Elsewhere</h3>
        <div class="links" id="life-links"></div>
      </aside>
    </div>
  </section>

</main>


<!-- ── 3f. FOOTER ──────────────────────────────────────────────────────── -->

<div class="wrap"><footer class="foot" id="foot"></footer></div>


<!-- ── 3g. FULL-SCREEN PROJECT VIEW ────────────────────────────────────── -->
<!-- Opened by the script when a project is clicked; closed with the button or Esc. -->

<dialog class="modal" id="modal" aria-label="Project">
  <button class="modal-close" type="button" data-close>Close ✕</button>
  <div class="modal-inner" id="modal-body"></div>
</dialog>

<!-- ═══════════════════════════════ END OF PART 3 ═══════════════════════════════ -->



<script>
/* ═══════════════════════════════════════════════════════════════════════════
   PART 4 · SCRIPT                                                🚫 DO NOT EDIT
   ═══════════════════════════════════════════════════════════════════════════
   Reads SITE / ABOUT / RESUME / CATEGORIES / PROJECTS / LIFE from Part 1 and
   builds the page. Handles the tabs, the category filter, the card
   slideshows (1–6 files each) and the full-screen view with its gallery.
   No content lives here.
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  "use strict";


  /* ── 4a. SETTINGS ───────────────────────────────────────────────────────── */
  /* The tab names, and which tab / category filter is open right now.

     ✏️ EDITABLE:      the SECOND word in each pair below.
                       ON THE WEBSITE: the name shown on that tab.
     🚫 NOT EDITABLE:  the FIRST word. It is the address-bar name
                       (#projects) and must match the ids in Part 3. */

  var TABS = [
    ["about",    "About Me"],
    ["resume",   "Resume"],
    ["projects", "Projects"],
    ["life",     "Life"]
  ];
  var currentTab = "about";
  var currentCat = "all";
  var MAX_IMAGES = 6;          // a project shows at most this many files



  /* ── 4b. HELPERS ────────────────────────────────────────────────────────── */
  /* Small utilities used by every render function below. */

  function $(id) { return document.getElementById(id); }

  // Make text safe to drop into HTML.
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Blank line → new paragraph; single line break → <br>.
  function paras(text) {
    return String(text || "").trim().split(/\n\s*\n/).filter(Boolean).map(function (p) {
      return "<p>" + esc(p.trim()).replace(/\n/g, "<br>") + "</p>";
    }).join("");
  }

  function isExternal(url) { return /^https?:\/\//i.test(url || ""); }
  function linkAttrs(url) { return isExternal(url) ? ' target="_blank" rel="noopener"' : ""; }

  function isPdf(src) { return /\.pdf$/i.test(src || ""); }

  // An image box. Shows the photo if a path is given, otherwise a placeholder.
  // If the path points at a file that does not exist (typo, or a photo not
  // added yet), the broken image is removed and the placeholder shows instead.
  // A .pdf shows as a "PDF" tile on cards; with opts.embedPdf (the full-screen
  // view) the document itself is shown, with an "Open PDF" link as fallback.
  // opts: { tag, cls, attrs, person, embedPdf }
  function pic(src, alt, opts) {
    opts = opts || {};
    src = String(src || "").trim();
    var tag = opts.tag || "span";
    var pdf = isPdf(src);
    var cls = "pic" + (src ? "" : " empty") + (pdf && !opts.embedPdf ? " doc" : "") +
      (opts.person ? " person" : "") + (opts.cls ? " " + opts.cls : "");
    var onerr = ' onerror="this.parentNode.classList.add(\'empty\');this.remove()"';
    var inner = "";
    if (src && pdf && opts.embedPdf) {
      inner = '<object class="pdf" data="' + esc(src) + '" type="application/pdf" aria-label="' + esc(alt) + '">' +
        '<a class="pdf-link" href="' + esc(src) + '" target="_blank" rel="noopener">Open PDF ↗</a></object>';
    } else if (src && !pdf) {
      inner = '<img src="' + esc(src) + '" alt="' + esc(alt) + '" loading="lazy"' + onerr + ">";
    }
    return "<" + tag + ' class="' + cls + '"' + (opts.attrs || "") + ">" + inner + "</" + tag + ">";
  }

  function categoryLabel(id) {
    var c = CATEGORIES.filter(function (x) { return x.id === id; })[0];
    return c ? c.label : id;
  }

  // A project's categories as a list. Accepts  "design",
  // ["engineering", "design"]  or  "engineering, design".
  function catsOf(p) {
    var c = p.category;
    var list = Array.isArray(c) ? c : String(c || "").split(",");
    return list.map(function (x) { return String(x).trim(); }).filter(Boolean);
  }

  // "2023–2025" → 2025; no year → -1 (sorts to the end).
  function yearOf(p) {
    var m = String(p.year || "").match(/\d{4}/g);
    return m ? Math.max.apply(null, m.map(Number)) : -1;
  }
  function sorted(list) {
    if (!SITE.projectsNewestFirst) return list;
    return list.slice().sort(function (a, b) { return yearOf(b) - yearOf(a); });
  }


  /* ── 4c. SLIDESHOW ──────────────────────────────────────────────────────── */

  // A project's files: 1–6 of them, or a single "" for the placeholder box.
  function files(p) {
    var f = (p.images || []).filter(Boolean).slice(0, MAX_IMAGES);
    return f.length ? f : [""];
  }

  // The slideshow on a project card. Clicking a slide opens the project
  // with that same file highlighted in the gallery.
  function carousel(p) {
    var imgs = files(p);
    var multi = imgs.length > 1;
    var slides = imgs.map(function (src, i) {
      var alt = p.title + (multi ? " — image " + (i + 1) + " of " + imgs.length : "");
      return pic(src, alt, { tag: "button", cls: "car-slide",
        attrs: ' type="button" data-open="' + p._id + '" data-at="' + i + '" aria-label="Open ' + esc(p.title) + '"' });
    }).join("");
    return '<div class="car">' +
      '<div class="car-track">' + slides + "</div>" +
      (multi
        ? '<button class="car-btn prev" type="button" data-car="-1" aria-label="Previous image">&lsaquo;</button>' +
          '<button class="car-btn next" type="button" data-car="1" aria-label="Next image">&rsaquo;</button>' +
          '<div class="car-dots" aria-hidden="true">' +
            imgs.map(function (_, i) { return '<i class="' + (i ? "" : "on") + '"></i>'; }).join("") +
          "</div>"
        : "") +
      "</div>";
  }

  function slide(car, dir) {
    var track = car.querySelector(".car-track");
    var n = track.children.length, w = track.clientWidth;
    if (!n || !w) return;
    var i = Math.round(track.scrollLeft / w);
    var next = (i + dir + n) % n;            // wraps around at both ends
    track.scrollTo({ left: next * w, behavior: "smooth" });
  }

  // Keep the dots in step when a slideshow is swiped or scrolled.
  document.addEventListener("scroll", function (e) {
    var track = e.target;
    if (!(track instanceof Element) || !track.classList.contains("car-track")) return;
    var dots = track.parentNode.querySelectorAll(".car-dots i");
    if (!dots.length || !track.clientWidth) return;
    var i = Math.round(track.scrollLeft / track.clientWidth);
    dots.forEach(function (d, k) { d.classList.toggle("on", k === i); });
  }, true);


  /* ── 4d. RENDER EACH PAGE ───────────────────────────────────────────────── */
  /* One function per page. Each reads a Part 1 block and fills the matching
     Part 3 container. */

  // 4d-i. masthead + footer
  function renderHeader() {
    $("site-title").innerHTML = esc(SITE.titleLine1) + (SITE.titleLine2 ? "<br>" + esc(SITE.titleLine2) : "");
    $("site-sub").textContent = SITE.subtitle || "";
    $("site-sub").hidden = !SITE.subtitle;
    $("foot").textContent = SITE.footer || "";
  }

  // 4d-ii. tab bar
  function renderNav() {
    $("nav").innerHTML = '<span class="bar">|</span>' + TABS.map(function (t) {
      return '<button type="button" data-tab="' + t[0] + '"' + (t[0] === currentTab ? ' aria-current="page"' : "") + ">" +
        t[1] + '</button><span class="bar">|</span>';
    }).join("");
  }

  // 4d-iii. About Me page

  // Make the portrait as tall as the heading + introduction beside it,
  // keeping its 3:4 shape: width = 3/4 of the text's height.
  // A wider portrait can squeeze the text onto more lines, so repeat
  // until the two agree.
  function fitPortrait() {
    var hero = document.querySelector(".about-hero");
    var text = $("bio").parentNode;
    if (!hero || !text.offsetHeight) return;          // About tab is not showing
    if (window.matchMedia("(max-width: 480px)").matches) {
      hero.style.removeProperty("--portrait-w");      // phones: photo sits above the text
      return;
    }
    for (var i = 0; i < 8; i++) {
      var w = Math.round(text.offsetHeight * 3 / 4);
      w = Math.min(w, Math.round(hero.clientWidth * 0.4));   // never crowd out the text
      if (w + "px" === hero.style.getPropertyValue("--portrait-w")) break;
      hero.style.setProperty("--portrait-w", w + "px");
    }
  }

  function renderAbout() {
    $("portrait").innerHTML = pic(ABOUT.portrait, "Portrait", { cls: "portrait", person: true });
    $("bio").innerHTML = paras(ABOUT.bio);

    var rows = (ABOUT.info || []).filter(function (r) { return r && r.value; });
    $("info").innerHTML = rows.map(function (r) {
      var v = r.href
        ? '<a href="' + esc(r.href) + '"' + linkAttrs(r.href) + ">" + esc(r.value) + "</a>"
        : esc(r.value);
      return '<div class="info-row"><dt>' + esc(r.label) + ":</dt><dd>" + v + "</dd></div>";
    }).join("");

    // No side photo = hide its box and let the table use the full width.
    var side = $("side-photo");
    side.hidden = !ABOUT.sidePhoto;
    side.parentNode.classList.toggle("no-photo", !ABOUT.sidePhoto);
    side.innerHTML = ABOUT.sidePhoto ? pic(ABOUT.sidePhoto, "", { cls: "side-photo", person: true }) : "";

    var feat = sorted(PROJECTS.filter(function (p) { return p.featured; })).slice(0, 3);
    $("featured-wrap").hidden = !feat.length;
    $("featured").innerHTML = feat.map(function (p) {
      return '<button class="feat" type="button" data-open="' + p._id + '">' +
        pic((p.images || [])[0], p.title) +
        '<span class="ttl">' + esc(p.title) + "</span>" +
        '<span class="blurb">' + esc(p.blurb) + "</span></button>";
    }).join("");
  }

  // 4d-iv. Resume page
  function renderResume() {
    var f = String(RESUME.file || "").trim();
    if (!f) {
      $("resume-body").innerHTML =
        '<div class="paper-frame"><div class="paper-empty"><p>' + esc(RESUME.note || "Coming soon.") + "</p></div></div>";
      return;
    }
    $("resume-body").innerHTML =
      '<div class="paper-frame">' +
        '<object class="paper" data="' + esc(f) + '" type="application/pdf" aria-label="Resume PDF">' +
          '<div class="paper-empty"><p>This browser can’t show the PDF inline.</p>' +
          '<p><a href="' + esc(f) + '" target="_blank" rel="noopener">Open the PDF</a></p></div>' +
        "</object>" +
      "</div>" +
      '<div class="actions">' +
        '<a class="btn" href="' + esc(f) + '" download>Download PDF</a>' +
        '<a class="btn ghost" href="' + esc(f) + '" target="_blank" rel="noopener">Open in new tab</a>' +
      "</div>";
  }

  // 4d-v. Projects page
  function projectCard(p) {
    return '<article class="card">' + carousel(p) +
      '<button class="ttl" type="button" data-open="' + p._id + '">' + esc(p.title) +
        (p.year ? '<span class="yr">' + esc(p.year) + "</span>" : "") + "</button>" +
      '<p class="blurb">' + esc(p.blurb) + "</p></article>";
  }

  function renderProjects() {
    var all = [{ id: "all", label: "All" }].concat(CATEGORIES);
    $("cat-nav").innerHTML = '<span class="bar">|</span>' + all.map(function (c) {
      return '<button type="button" data-cat="' + esc(c.id) + '" aria-pressed="' + (c.id === currentCat) + '">' +
        esc(c.label) + '</button><span class="bar">|</span>';
    }).join("");

    var cols = $("cols");
    cols.className = "cols" + (currentCat === "all" ? "" : " filtered");
    cols.innerHTML = CATEGORIES.filter(function (c) {
      return currentCat === "all" || c.id === currentCat;
    }).map(function (c) {
      var list = sorted(PROJECTS.filter(function (p) { return catsOf(p).indexOf(c.id) !== -1; }));
      return '<section class="col"><h3 class="h3">' + esc(c.label) + '</h3><div class="col-list">' +
        (list.length ? list.map(projectCard).join("") : '<p class="blurb">Nothing here yet.</p>') +
        "</div></section>";
    }).join("");
  }

  // 4d-vi. Life page
  function renderLife() {
    $("life-intro").innerHTML = paras(LIFE.intro);
    var photos = (LIFE.photos || []).filter(Boolean);
    $("life-photos").hidden = !photos.length;
    $("life-photos").innerHTML = photos.map(function (src, i) {
      return pic(src, "Photo " + (i + 1), { person: true });
    }).join("");
    $("life-outro").innerHTML = paras(LIFE.outro);

    var links = (LIFE.links || []).filter(function (l) { return l && l.url; });
    $("life-aside").hidden = !links.length;
    $("life-links").innerHTML = links.map(function (l) {
      return '<a href="' + esc(l.url) + '"' + linkAttrs(l.url) + ">" + esc(l.label) +
        "<span>" + (isExternal(l.url) ? "↗" : "→") + "</span></a>";
    }).join("");
  }


  /* ── 4e. FULL-SCREEN PROJECT VIEW ───────────────────────────────────────── */

  var modalProject = null;   // the project currently open
  var galIndex = 0;          // which of its files is highlighted

  // One big highlight box plus a row of thumbnails (only if there is more
  // than one file). The highlight is filled in by highlight() below.
  function gallery(p) {
    var imgs = files(p);
    return '<div class="gal">' +
      '<div class="gal-main" id="gal-main"></div>' +
      (imgs.length > 1
        ? '<div class="gal-thumbs" id="gal-thumbs">' + imgs.map(function (src, i) {
            return pic(src, p.title + " — image " + (i + 1) + " of " + imgs.length,
              { tag: "button", attrs: ' type="button" data-gal="' + i + '" aria-label="Show image ' + (i + 1) + '"' });
          }).join("") + "</div>"
        : "") +
      "</div>";
  }

  // Make file number i the big one. Wraps around at both ends.
  function highlight(i) {
    if (!modalProject) return;
    var imgs = files(modalProject);
    galIndex = (i + imgs.length) % imgs.length;
    var src = imgs[galIndex];
    var main = $("gal-main");
    main.className = "gal-main" + (isPdf(src) ? " is-pdf" : "");
    main.innerHTML = pic(src, modalProject.title, { embedPdf: true });
    var thumbs = $("gal-thumbs");
    if (thumbs) {
      Array.prototype.forEach.call(thumbs.children, function (t, k) {
        t.classList.toggle("on", k === galIndex);
      });
    }
  }

  function openProject(id, at) {
    var p = PROJECTS[id];
    if (!p) return;
    modalProject = p;
    var meta = [
      ["Category", catsOf(p).map(categoryLabel).join(" · ")],
      ["Year", p.year],
      ["Role", p.role],
      ["Tools", p.tools]
    ].filter(function (m) { return m[1]; });

    $("modal-body").innerHTML =
      gallery(p) +
      "<h3>" + esc(p.title) + "</h3>" +
      '<div class="meta">' + meta.map(function (m) {
        return "<span><b>" + m[0] + "</b>" + esc(m[1]) + "</span>";
      }).join("") + "</div>" +
      '<div class="prose">' + (paras(p.description) || paras(p.blurb)) + "</div>" +
      (p.link ? '<p class="actions"><a class="btn" href="' + esc(p.link) + '" target="_blank" rel="noopener">Visit project ↗</a></p>' : "");
    highlight(at || 0);

    var m = $("modal");
    if (!m.open) m.showModal();
    m.scrollTop = 0;
  }


  /* ── 4f. TABS + ADDRESS BAR ─────────────────────────────────────────────── */
  /* The open tab lives in the URL:  #about  #resume  #projects  #life
     A category filter adds a second part:  #projects/design */

  function showTab(tab) {
    if (!TABS.some(function (t) { return t[0] === tab; })) tab = "about";
    currentTab = tab;
    TABS.forEach(function (t) { $("page-" + t[0]).hidden = t[0] !== tab; });
    renderNav();
    fitPortrait();
    window.scrollTo(0, 0);
  }

  function readHash() {
    var parts = location.hash.replace(/^#/, "").split("/");
    var tab = parts[0] || "about";
    var cat = parts[1] || "all";
    currentCat = CATEGORIES.some(function (c) { return c.id === cat; }) ? cat : "all";
    renderProjects();
    showTab(tab);
  }


  /* ── 4g. CLICKS + KEYS ──────────────────────────────────────────────────── */

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-tab],[data-cat],[data-open],[data-car],[data-gal],[data-close]");
    if (!t) return;
    var d = t.dataset;
    if ("tab" in d)        location.hash = d.tab;
    else if ("cat" in d)   location.hash = "projects" + (d.cat === "all" ? "" : "/" + d.cat);
    else if ("open" in d)  openProject(Number(d.open), Number(d.at || 0));
    else if ("car" in d)   slide(t.closest(".car"), Number(d.car));
    else if ("gal" in d)   highlight(Number(d.gal));
    else if ("close" in d) $("modal").close();
  });

  // Arrow keys move the gallery highlight while a project is open.
  $("modal").addEventListener("keydown", function (e) {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    highlight(galIndex + (e.key === "ArrowRight" ? 1 : -1));
    e.preventDefault();
  });


  /* ── 4h. START ──────────────────────────────────────────────────────────── */

  function init() {
    // Drop projects marked  hidden: true  before anything is drawn.
    for (var h = PROJECTS.length - 1; h >= 0; h--) {
      if (PROJECTS[h].hidden) PROJECTS.splice(h, 1);
    }
    PROJECTS.forEach(function (p, i) {
      p._id = i;
      if ((p.images || []).length > MAX_IMAGES) {
        console.warn('Project "' + p.title + '" lists ' + p.images.length +
          " files; only the first " + MAX_IMAGES + " are shown.");
      }
      catsOf(p).forEach(function (id) {
        if (!CATEGORIES.some(function (c) { return c.id === id; })) {
          console.warn('Project "' + p.title + '" has category "' + id +
            '", which is not in CATEGORIES, so it will not be shown there.');
        }
      });
    });
    renderHeader();
    renderAbout();
    renderResume();
    renderLife();
    readHash();                                   // renders projects + picks the tab
    window.addEventListener("hashchange", readHash);
    window.addEventListener("resize", fitPortrait);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitPortrait);
  }

  try {
    init();
  } catch (err) {
    // Most likely a typo in Part 1 (a missing comma or quote). Show it on the page.
    document.body.insertAdjacentHTML("afterbegin",
      '<div class="oops"><strong>The page couldn’t build.</strong> This is almost always a ' +
      'missing comma, quote or bracket in PART 1 of index.html. The browser says: ' +
      "<code>" + esc(err.message) + "</code></div>");
    throw err;
  }
})();

/* ═══════════════════════════════ END OF PART 4 ═══════════════════════════════ */
</script>
